name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GroupDocs.Search.Benchmarks.slnx

      - name: Build
        run: dotnet build GroupDocs.Search.Benchmarks.slnx --configuration Release --no-restore -warnaserror

      - name: Check the code style
        run: dotnet format GroupDocs.Search.Benchmarks.slnx --verify-no-changes --no-restore
